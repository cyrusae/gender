[project]
name = "gbleed"
version = "0.1.0"
description = "Grammatical gender bleedthrough in LLMs: probing, erasure and steering"
readme = "README.md"
authors = [
    { name = "Cyrus", email = "86699936+cyrusae@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "concept-erasure>=0.2.4",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "tabulate>=0.10.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.18.0",
    "wordfreq>=3.1.1",
]

[project.scripts]
gbleed = "gbleed.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
